<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="base-path" content="{{ base_path }}">
  <title>Word 图片导出 · 批量水印</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>Word 图片导出 · 批量水印</h1>
      <p>上传本地 Word 文档，一键抽取内嵌图片，勾选目标后批量添加自定义水印，导出为 ZIP 图片包或全新 Word 文档。</p>
    </header>

    <!-- 步骤 1：上传 -->
    <section class="step" id="step-upload">
      <div class="drop" id="drop">
        <input type="file" id="file" accept=".docx" hidden>
        <div class="drop__inner">
          <div class="drop__icon">📄</div>
          <p>把 .docx 文件拖到这里，或 <button type="button" class="link" id="pick">点击选择</button></p>
          <p class="drop__hint">仅支持 .docx（.doc 请先在 Word 中另存为 .docx）</p>
        </div>
      </div>
      <div class="status" id="upload-status"></div>
    </section>

    <!-- 步骤 2：图片网格 -->
    <section class="step hidden" id="step-grid">
      <div class="grid-head">
        <h2>抽取到 <span id="img-count">0</span> 张图片</h2>
        <div class="grid-actions">
          <label class="chk"><input type="checkbox" id="select-all"> 全选</label>
          <button type="button" class="btn btn--ghost btn--sm" id="reset">重新上传</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
      <p class="note" id="vec-note" hidden>注：矢量格式（emf/wmf）浏览器无法预览，已自动排除在加水印范围外。</p>
    </section>

    <!-- 步骤 3：水印设置 + 预览 + 导出 -->
    <section class="step hidden" id="step-wm">
      <div class="wm-layout">
        <div class="wm-settings">
          <h2>水印设置</h2>

          <div class="field">
            <label for="wm-text">水印文字</label>
            <input type="text" id="wm-text" value="仅供内部参考" placeholder="输入水印文字">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="wm-size">字号（相对）</label>
              <div class="field-line">
                <input type="range" id="wm-size" min="12" max="120" value="48">
                <span class="val" id="wm-size-val">48</span>
              </div>
            </div>
            <div class="field">
              <label for="wm-opacity">透明度</label>
              <div class="field-line">
                <input type="range" id="wm-opacity" min="5" max="100" value="35">
                <span class="val" id="wm-opacity-val">35%</span>
              </div>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="wm-color">颜色</label>
              <input type="color" id="wm-color" value="#ffffff">
            </div>
            <div class="field">
              <label for="wm-rotate">旋转角度</label>
              <div class="field-line">
                <input type="range" id="wm-rotate" min="-90" max="90" value="-30">
                <span class="val" id="wm-rotate-val">-30°</span>
              </div>
            </div>
          </div>

          <div class="field">
            <label>布局</label>
            <div class="seg" id="wm-layout">
              <button type="button" class="seg__btn is-active" data-layout="tile">平铺满屏</button>
              <button type="button" class="seg__btn" data-layout="single">单点水印</button>
            </div>
          </div>

          <div class="field" id="pos-field" style="display:none;">
            <label>位置 <span class="hint">点击九宫格快速定位，或直接在预览图上拖拽水印</span></label>
            <div class="pos-grid" id="wm-position">
              <button type="button" class="pos__btn" data-pos="tl" title="左上"></button>
              <button type="button" class="pos__btn" data-pos="tc" title="中上"></button>
              <button type="button" class="pos__btn" data-pos="tr" title="右上"></button>
              <button type="button" class="pos__btn" data-pos="ml" title="左中"></button>
              <button type="button" class="pos__btn" data-pos="mc" title="居中"></button>
              <button type="button" class="pos__btn" data-pos="mr" title="右中"></button>
              <button type="button" class="pos__btn" data-pos="bl" title="左下"></button>
              <button type="button" class="pos__btn" data-pos="bc" title="中下"></button>
              <button type="button" class="pos__btn is-active" data-pos="br" title="右下"></button>
            </div>
          </div>

          <div class="field" id="gap-field">
            <label for="wm-gap">平铺间距</label>
            <div class="field-line">
              <input type="range" id="wm-gap" min="80" max="600" value="240">
              <span class="val" id="wm-gap-val">240</span>
            </div>
          </div>

          <div class="field">
            <label class="chk"><input type="checkbox" id="wm-logo-on"> 使用图片 Logo（替代文字）</label>
            <input type="file" id="wm-logo" accept="image/*" hidden>
            <button type="button" class="btn btn--ghost btn--sm" id="wm-logo-pick" hidden>选择 Logo 图片</button>
            <span class="hint" id="wm-logo-name"></span>
          </div>

          <div class="field">
            <button type="button" class="btn btn--primary" id="export">图片打包导出zip（<span id="export-count">0</span> 张）</button>
          </div>
          <div class="field">
            <button type="button" class="btn btn--primary" id="export-docx">导出新word文档</button>
          </div>
        </div>

        <div class="wm-preview">
          <h2>预览（第一张选中图）</h2>
          <div class="preview-box">
            <canvas id="preview"></canvas>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
