<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="我的小世界 - 只属于我的本地小空间" />
  <title>我的小世界 · My World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&family=Space+Grotesk:wght@400;500;600&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=20260801b" />
  <style>
    .world-page {
      min-height: 100vh;
      background: var(--bg);
      background-image: var(--bg-grad);
      color: var(--text);
      padding: var(--sp-6) clamp(var(--sp-5), 5vw, var(--sp-8));
    }
    .world-top {
      display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4);
      max-width: 900px; margin: 0 auto var(--sp-8);
    }
    .world-back {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-soft); font-weight: 600; font-size: .9rem;
      text-decoration: none; transition: gap .25s var(--ease), color .25s;
    }
    .world-back:hover { gap: 12px; color: var(--accent); }
    .world-title {
      font-family: var(--font-display); font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800;
      letter-spacing: -.03em; display: flex; align-items: center; gap: 14px;
    }
    .world-title__icon {
      width: 52px; height: 52px; border-radius: 16px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(51,65,85,0.95));
      color: #fff; box-shadow: 0 10px 26px rgba(15,23,42,0.18);
    }
    .world-title__icon svg { width: 26px; height: 26px; }
    .world-grid {
      max-width: 900px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr; gap: var(--sp-6);
    }
    .world-card {
      position: relative;
      border-radius: calc(var(--radius) + 8px);
      background: linear-gradient(135deg, rgba(255,255,255,0.78) 0%, rgba(255,255,255,0.52) 100%);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255,255,255,0.65);
      overflow: hidden;
      transition: transform .35s var(--ease), box-shadow .35s var(--ease);
    }
    .world-card:hover { transform: translateY(-4px); box-shadow: 0 28px 64px rgba(15,23,42,0.14); }
    .world-card__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sp-5) var(--sp-6) 0;
    }
    .world-card__title { font-size: clamp(1.2rem, 3vw, 1.5rem); font-weight: 700; }
    .world-card__body { padding: var(--sp-4) var(--sp-6) var(--sp-6); }
    .world-empty {
      display: grid; place-items: center; gap: var(--sp-4);
      padding: clamp(60px, 12vh, 120px) var(--sp-4);
      text-align: center; color: var(--text-soft);
    }
    .world-empty__icon {
      width: 72px; height: 72px; border-radius: 24px;
      display: grid; place-items: center;
      background: rgba(255,255,255,0.5); border: 1px solid rgba(15,23,42,0.08);
      color: var(--text-faint);
    }
    .world-empty__icon svg { width: 32px; height: 32px; }
    .world-empty__title { font-size: 1.1rem; font-weight: 600; color: var(--text); }
    .world-empty__text { font-size: .9rem; color: var(--text-faint); max-width: 320px; }
    .world-sphere-link {
      display: block; text-decoration: none; cursor: pointer;
      position: relative;
    }
    .world-sphere-stage {
      position: relative; width: 100%; height: 340px;
      display: grid; place-items: center; overflow: hidden;
      border-radius: calc(var(--radius) + 4px);
      background: radial-gradient(circle at 50% 50%, rgba(99,102,241,0.06), transparent 70%);
    }
    .world-sphere-stage canvas {
      width: 280px !important; height: 280px !important;
      border-radius: 50%;
      cursor: pointer;
    }
    .world-moon-stage {
      height: 280px;
      background: radial-gradient(circle at 50% 50%, rgba(120,120,130,0.08), transparent 70%);
    }
    .world-moon-stage canvas {
      width: 220px !important;
      height: 220px !important;
    }
    [data-theme="dark"] .world-moon-stage { background: radial-gradient(circle at 50% 50%, rgba(120,120,130,0.12), transparent 70%); }
    .world-sphere-label {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      padding: 8px 18px; border-radius: 999px;
      background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.6);
      color: var(--text); font-size: .85rem; font-weight: 600;
      backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(15,23,42,0.08);
      transition: transform .25s var(--ease), box-shadow .25s;
      pointer-events: none;
    }
    .world-sphere-link:hover .world-sphere-label { transform: translateX(-50%) translateY(-2px); box-shadow: 0 10px 28px rgba(15,23,42,0.12); }
    [data-theme="dark"] .world-sphere-stage { background: radial-gradient(circle at 50% 50%, rgba(99,102,241,0.1), transparent 70%); }
    [data-theme="dark"] .world-sphere-label { background: rgba(15,23,42,0.55); border-color: rgba(255,255,255,0.12); color: var(--text); }
    .world-theme-toggle {
      width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer;
      display: grid; place-items: center; transition: transform .25s, box-shadow .25s;
    }
    .world-theme-toggle:hover { transform: rotate(12deg); box-shadow: var(--shadow-sm); }
    .world-theme-toggle svg { width: 20px; height: 20px; }

    [data-theme="dark"] .world-page { background: var(--bg); background-image: var(--bg-grad); }
    [data-theme="dark"] .world-card {
      background: linear-gradient(135deg, rgba(30,41,59,0.8) 0%, rgba(15,23,42,0.62) 100%);
      border-color: rgba(255,255,255,0.12);
      box-shadow: 0 18px 48px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    [data-theme="dark"] .world-card:hover { box-shadow: 0 28px 64px rgba(0,0,0,0.45); }
    [data-theme="dark"] .world-empty__icon { background: rgba(15,23,42,0.35); border-color: rgba(255,255,255,0.1); }

    @media (max-width: 640px) {
      .world-top { flex-direction: column; align-items: flex-start; gap: var(--sp-4); }
    }
  </style>
</head>
<body>
  <div class="world-page">
    <div class="world-top">
      <a class="world-back" href="/">← 返回首页</a>
      <button class="world-theme-toggle" id="worldThemeToggle" type="button" aria-label="切换明暗主题">
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <h1 class="world-title">
      <span class="world-title__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </span>
      我的小世界
    </h1>

    <div class="world-grid">
      <section class="world-card">
        <div class="world-card__head">
          <h2 class="world-card__title">地球</h2>
        </div>
        <div class="world-card__body">
          <a class="world-sphere-link" href="/sphere.html" rel="noopener noreferrer" aria-label="打开 3D 地球">
            <div class="world-sphere-stage" id="worldSphereStage">
              <div class="world-sphere-label">点击打开 3D 地球 →</div>
            </div>
          </a>
        </div>
      </section>

      <section class="world-card">
        <div class="world-card__head">
          <h2 class="world-card__title">月球</h2>
        </div>
        <div class="world-card__body">
          <a class="world-sphere-link" href="/moon.html" rel="noopener noreferrer" aria-label="打开 3D 月球">
            <div class="world-sphere-stage world-moon-stage" id="moonSphereStage">
              <div class="world-sphere-label">点击打开 3D 月球 →</div>
            </div>
          </a>
        </div>
      </section>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/js/world.js?v=12"></script>
</body>
</html>
