  <style>
    :root {
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --stage-bg: radial-gradient(140% 120% at 50% 18%, #1b2440 0%, #0c1020 48%, #070912 100%);
      --stage-bg-light: radial-gradient(140% 120% at 50% 18%, #eef1ff 0%, #dde3f7 48%, #cfd7ee 100%);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Manrope', 'Noto Sans SC', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      background: var(--stage-bg);
      color: #fff;
      transition: background .6s var(--ease);

    /* 顶部导航 */
    .ws-nav {

    .ws-theme {

      transition: transform .3s var(--ease), border-color .3s;

    [data-theme='dark'] .ws-theme .ico-sun { display: none; }

    /* 舞台 */
    .ws-stage {

      touch-action: none; cursor: grab;
      perspective: 1100px;
    }
    .ws-stage:active { cursor: grabbing; }
    .ws-cloud { position: relative; width: 1px; height: 1px; transform-style: preserve-3d; will-change: transform; }
    .ws-ring { position: absolute; transform-style: preserve-3d; }
    .ws-icon {
      position: absolute; top: 50%; left: 50%;
      margin: -19px 0 0 -19px; width: 38px; height: 38px; border-radius: 11px;
      background: rgba(255,255,255,.96);

      display: grid; place-items: center;
      transform-style: preserve-3d; backface-visibility: hidden; will-change: transform, opacity;
    }
    [data-theme='light'] .ws-icon { box-shadow: 0 10px 26px rgba(99,102,241,.30), 0 2px 6px rgba(15,23,42,.14); }
    .ws-icon svg { width: 21px; height: 21px; flex-shrink: 0; }

    /* 文案面板 */
    .ws-panel {

      transform: translateY(-50%); max-width: 380px;
      padding: 4px; pointer-events: none;
    }
    .ws-kicker {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: 'Space Grotesk', sans-serif; font-size: .7rem; letter-spacing: .26em;
      text-transform: uppercase; color: #8b9bff; font-weight: 600; margin-bottom: 18px;
    }
    [data-theme='light'] .ws-kicker { color: #5b6bff; }
    .ws-kicker::before { content: ''; width: 26px; height: 1px; background: currentColor; display: inline-block; }
    .ws-panel h1 {
      font-family: 'Bricolage Grotesque', 'Noto Serif SC', serif;
      font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.04; font-weight: 800;

    .ws-panel p { font-size: 1rem; line-height: 1.7; margin: 0 0 22px; opacity: .82; }
    .ws-tags { display: flex; gap: 9px; flex-wrap: wrap; }
    .ws-tag {
      font-size: .68rem; letter-spacing: .08em; text-transform: uppercase;
      font-family: 'Space Grotesk', sans-serif; padding: 6px 12px; border-radius: 999px;
      background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16); color: #fff;
    }
    [data-theme='light'] .ws-tag { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.10); color: #1a2230; }

    /* 底部提示 */
    .ws-hint {
      position: fixed; z-index: 20; left: 50%; bottom: 34px; transform: translateX(-50%);
      display: flex; gap: 22px; font-size: .78rem; letter-spacing: .04em; opacity: .7;
      font-family: 'Space Grotesk', sans-serif; pointer-events: none;
    }
    .ws-hint span { display: inline-flex; align-items: center; gap: 7px; }
    .ws-hint svg { width: 15px; height: 15px; }

    @media (max-width: 720px) {
      .ws-panel { top: auto; bottom: 92px; transform: none; left: 20px; right: 20px; max-width: none; }
      .ws-panel p { display: none; }
      .ws-hint { bottom: 22px; gap: 16px; font-size: .72rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ws-icon { animation: none !important; transition: none !important; }
    }
  </style>

        <div class="ws-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="21"/><line x1="3" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="21" y2="12"/><line x1="5.6" y1="5.6" x2="9" y2="9"/><line x1="15" y1="15" x2="18.4" y2="18.4"/><line x1="18.4" y1="5.6" x2="15" y2="9"/><line x1="9" y1="15" x2="5.6" y2="18.4"/></svg></div>

  <aside class="ws-panel">
    <div class="ws-kicker">Interactive · CSS 3D</div>
    <h1>能力星球</h1>
    <p>把常用的能力、工具与灵感聚成一颗可旋转的球。它用纯 CSS 3D 变换构建——48 个图标沿斐波那契球面均匀分布，随指针视差与拖拽自由旋转，滚轮缩放。</p>
    <div class="ws-tags">
      <span class="ws-tag">CSS 3D Transform</span>
      <span class="ws-tag">48 Icons</span>
      <span class="ws-tag">Fibonacci Sphere</span>
      <span class="ws-tag">Pointer Parallax</span>
    </div>
  </aside>

  <div class="ws-hint">
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6m0 6v6M3 12h6m6 0h6"/><circle cx="12" cy="12" r="3"/></svg> 拖拽旋转</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg> 滚轮缩放</span>
  </div>

  <script>
    (() => {
      // 主题：复用首页 localStorage key 'theme'，跨页一致
      const root = document.documentElement;
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      document.getElementById('wsTheme').addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });

      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const stage = document.getElementById('wsStage');
      const cloud = document.getElementById('wsCloud');
      const ring = document.getElementById('wsRing');
      if (!ring) return;

      // 基础 10 个图标克隆到 48 个，沿斐波那契球面分布
      const TARGET = 48;
      const base = Array.prototype.slice.call(ring.children);
      for (let i = base.length; i < TARGET; i++) {
        ring.appendChild(base[i % base.length].cloneNode(true));
      }
      const icons = Array.prototype.slice.call(ring.querySelectorAll('.ws-icon'));
      const N = icons.length;

      // 半径跟随舞台尺寸
      let R = Math.min(window.innerWidth, window.innerHeight) * 0.34;
      const setR = () => { R = Math.min(window.innerWidth, window.innerHeight) * 0.34; };
      setR();
      window.addEventListener('resize', setR, { passive: true });

      const PI2 = Math.PI * 2;
      const golden = (1 + Math.sqrt(5)) / 2;
      const sph = icons.map((_, i) => {
        const y = 1 - (i / (N - 1)) * 2;
        const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = PI2 * i / golden;
        return { x: Math.cos(theta) * radiusAtY, y: y, z: Math.sin(theta) * radiusAtY };
      });

      // 旋转状态：autoRot(自转) + drag(拖拽)
      let rotY = 0, rotX = -8, velY = 0.12, velX = 0;
      let dragging = false, lastX = 0, lastY = 0, moved = false;

      stage.addEventListener('pointerdown', (e) => {
        dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY;
        velY = 0; velX = 0;
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
        rotY += dx * 0.3; rotX += dy * 0.3;
        rotX = Math.max(-80, Math.min(80, rotX));
        lastX = e.clientX; lastY = e.clientY;
        velY = dx * 0.3; velX = dy * 0.3;
      });
      const endDrag = () => { dragging = false; };
      stage.addEventListener('pointerup', endDrag);
      stage.addEventListener('pointercancel', endDrag);
      stage.addEventListener('pointerleave', endDrag);

      // 滚轮缩放
      stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        R = Math.max(window.innerHeight * 0.18, Math.min(window.innerHeight * 0.5, R - e.deltaY * 0.4));
      }, { passive: false });

      function render() {
        if (!dragging) {
          rotY += velY; rotX += velX;
          rotX = Math.max(-80, Math.min(80, rotX));
          velY *= 0.94; velX *= 0.94;
          if (Math.abs(velY) < 0.02 && Math.abs(velX) < 0.02) { velY = 0; velX = 0; }
          rotY += 0.12; // 惯性停下后继续缓慢自转
        }
        const cosX = Math.cos(rotX * Math.PI / 180), sinX = Math.sin(rotX * Math.PI / 180);
        const cosY = Math.cos(rotY * Math.PI / 180), sinY = Math.sin(rotY * Math.PI / 180);
        for (let i = 0; i < N; i++) {
          const p = sph[i];
          // 先绕 Y，再绕 X
          const x1 = p.x * cosY - p.z * sinY;
          const z1 = p.x * sinY + p.z * cosY;
          const y1 = p.y;
          const x2 = x1;
          const y2 = y1 * cosX - z1 * sinX;
          const z2 = y1 * sinX + z1 * cosX;
          const sx = x2 * R, sy = -y2 * R, wz = z2 * R;
          const d = z2;
          const scale = 0.55 + (d + 1) / 2 * 0.5;
          const opacity = 0.35 + (d + 1) / 2 * 0.65;
          const blur = Math.max(0, -d) * 1.1;
          const icon = icons[i];
          icon.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,' + wz.toFixed(1) + 'px) scale(' + scale.toFixed(3) + ')';
          icon.style.opacity = opacity.toFixed(3);
          icon.style.filter = blur > 0.1 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
          icon.style.zIndex = String(Math.round((d + 1) * 100));
        }
        cloud.style.transform = 'translateZ(0)';
        requestAnimationFrame(render);
      }
      render();
    })();
  </script>
</body>
