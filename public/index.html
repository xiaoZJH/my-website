<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一个本地优先的个人工具箱与博客：常用开发小工具随手可用，访问统计真实落在本地数据库。" />
  <title>Toolbox · 个人工具箱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Landing / Splash：粒子波浪全屏入口 -->
  <div class="landing" id="landing" aria-hidden="false">
    <canvas class="landing__canvas" id="landingCanvas" aria-hidden="true"></canvas>
    <div class="landing__vignette" aria-hidden="true"></div>
    <div class="landing__content">
      <div class="landing__brand">
        <span class="landing__mark" aria-hidden="true"></span>
        <span class="landing__brand-name">Toolbox</span>
      </div>
      <h1 class="landing__title">
        <span class="landing__title-line">个人工具箱</span>
        <span class="landing__title-line landing__title-line--accent">与数字笔记</span>
      </h1>
      <p class="landing__lead">本地优先 · 隐私友好 · 随手可用</p>

      <!-- 登录 / 注册 gate -->
      <div class="gate" id="gate">
        <h2 class="gate__title" id="authTitle">登录</h2>
        <div class="gate__tabs" role="tablist" aria-label="登录方式">
          <button class="gate__tab is-active" data-auth-tab="login" type="button" role="tab" aria-selected="true">登录</button>
          <button class="gate__tab" data-auth-tab="register" type="button" role="tab" aria-selected="false">注册</button>
        </div>
        <form class="gate__form" id="authForm" novalidate>
          <div class="gate__field" data-field="identifier">
            <label for="authIdentifier">账号</label>
            <input id="authIdentifier" type="text" name="identifier" autocomplete="username" placeholder="用户名 / 邮箱 / 手机号" />
          </div>
          <div class="gate__field" data-field="username">
            <label for="authUsername">用户名</label>
            <input id="authUsername" type="text" name="username" autocomplete="username" placeholder="3-20 位字母、数字或下划线" />
          </div>
          <div class="gate__field" data-field="email">
            <label for="authEmail">邮箱（可选）</label>
            <input id="authEmail" type="email" name="email" autocomplete="email" placeholder="you@example.com" />
          </div>
          <div class="gate__field" data-field="phone">
            <label for="authPhone">手机号</label>
            <input id="authPhone" type="tel" name="phone" autocomplete="tel" placeholder="11 位手机号" />
          </div>
          <div class="gate__field" data-field="code">
            <label for="authCode">短信验证码</label>
            <div class="gate__code-row">
              <input id="authCode" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" />
              <button type="button" class="gate__code-btn" data-auth-send>获取验证码</button>
            </div>
          </div>
          <div class="gate__field" data-field="password">
            <label for="authPassword">密码</label>
            <input id="authPassword" type="password" name="password" autocomplete="current-password" placeholder="至少 8 位" />
          </div>
          <div class="gate__error" id="authError" hidden></div>
          <button type="submit" class="gate__submit" id="authSubmit">登录</button>
          <p class="gate__hint" id="authHint"></p>
        </form>
        <div class="gate__alt">
          <button type="button" class="gate__link" data-auth-mode="code">使用手机号 + 短信验证码登录</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 主页动态海洋壁纸背景：随主题切换白天/夜晚，鼠标可互动（涟漪/光斑/视差） -->
  <canvas class="home-sea" id="homeSea" aria-hidden="true"></canvas>
  <!-- 轻量化导航栏 -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="brand" href="#/" data-link>
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Toolbox</span>
      </a>
      <nav class="nav__links" aria-label="主导航">
        <a href="#/" data-link class="nav__link is-active">首页</a>
        <a href="#/tools" data-link class="nav__link">工具箱</a>
        <a href="#/blog" data-link class="nav__link">博客</a>
        <a href="#/about" data-link class="nav__link">关于</a>
      </nav>
      <div class="nav__right">
        <span class="visitor-chip" id="visitorChip" title="累计访问量">
          <span class="visitor-chip__dot" aria-hidden="true"></span>
          <span id="visitorCount">—</span>
        </span>
        <div class="auth-area" id="authArea"><!-- 由 app.js 注入：登录按钮 / 已登录用户区 --></div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深浅色">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="view"><!-- 视图由 app.js 渲染 --></main>

  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__copy">本地优先 · 数据不出本机 · 访问统计存于本地 SQLite</p>
      <p class="footer__meta">Built with vanilla JS + Node · <span id="footerYear"></span></p>
    </div>
  </footer>

  <!-- 工具抽屉 -->
  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer__scrim" data-close></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer__head">
        <div class="drawer__title-wrap">
          <span class="drawer__icon" id="drawerIcon" aria-hidden="true"></span>
          <h2 class="drawer__title" id="drawerTitle">工具</h2>
        </div>
        <button class="drawer__close" type="button" data-close aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="drawer__body" id="drawerBody"></div>
    </aside>
  </div>

  <!-- 登录 gate 已集成在 landing 中 -->

  <script src="/js/tools.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
