<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一个本地优先的个人工具箱与博客：常用开发小工具随手可用，访问统计真实落在本地数据库。" />
  <title>Toolbox · 个人工具箱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Landing / Splash：粒子波浪全屏入口 -->
  <div class="landing" id="landing" aria-hidden="false">
    <canvas class="landing__canvas" id="landingCanvas" aria-hidden="true"></canvas>
    <div class="landing__vignette" aria-hidden="true"></div>
    <div class="landing__topbar">
      <div class="landing__auth" id="landingAuth">
        <button class="landing__top-btn" id="landingSignin" type="button">Sign in</button>
        <button class="landing__top-btn" id="landingLogout" type="button">Log off</button>
      </div>
    </div>
    <div class="landing__content">
      <div class="landing__brand">
        <span class="landing__mark" aria-hidden="true"></span>
        <span class="landing__brand-name">Toolbox</span>
      </div>
      <h1 class="landing__title">
        <span class="landing__title-line">个人工具箱</span>
        <span class="landing__title-line landing__title-line--accent">与数字笔记</span>
      </h1>
      <p class="landing__lead">本地优先 · 隐私友好 · 随手可用</p>

      <button class="landing__cta" id="enterBtn" type="button">
        <span>进入网站</span>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <p class="landing__hint">点击按钮或按 Enter 键进入</p>
    </div>
  </div>

  <!-- 主页动态海洋壁纸背景：随主题切换白天/夜晚，鼠标可互动（涟漪/光斑/视差） -->
  <canvas class="home-sea" id="homeSea" aria-hidden="true"></canvas>
  <!-- 轻量化导航栏 -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="brand" href="#/" data-link>
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Toolbox</span>
      </a>
      <nav class="nav__links" aria-label="主导航">
        <a href="#/" data-link class="nav__link is-active">首页</a>
        <a href="#/tools" data-link class="nav__link">工具箱</a>
        <a href="#/blog" data-link class="nav__link">博客</a>
        <a href="#/about" data-link class="nav__link">关于</a>
      </nav>
      <div class="nav__right">
        <span class="visitor-chip" id="visitorChip" title="累计访问量">
          <span class="visitor-chip__dot" aria-hidden="true"></span>
          <span id="visitorCount">—</span>
        </span>
        <div class="auth-area" id="authArea"><!-- 由 app.js 注入：登录按钮 / 已登录用户区 --></div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深浅色">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="view"><!-- 视图由 app.js 渲染 --></main>

  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__copy">本地优先 · 数据不出本机 · 访问统计存于本地 SQLite</p>
      <p class="footer__meta">Built with vanilla JS + Node · <span id="footerYear"></span></p>
    </div>
  </footer>

  <!-- 工具抽屉 -->
  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer__scrim" data-close></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer__head">
        <div class="drawer__title-wrap">
          <span class="drawer__icon" id="drawerIcon" aria-hidden="true"></span>
          <h2 class="drawer__title" id="drawerTitle">工具</h2>
        </div>
        <button class="drawer__close" type="button" data-close aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="drawer__body" id="drawerBody"></div>
    </aside>
  </div>

  <!-- 登录 / 注册 Modal：台灯吉祥物 + 霓虹玻璃卡片 -->
  <div class="auth-modal" id="authModal" aria-hidden="true">
    <div class="auth-modal__scrim" data-auth-close></div>
    <div class="auth-modal__stage" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button class="auth-modal__close" type="button" data-auth-close aria-label="关闭">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

      <div class="auth-modal__lamp lamp" id="authLamp" aria-hidden="true">
        <svg class="lamp__svg" viewBox="0 0 220 420" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="shadeGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--lamp-light)"/>
              <stop offset="100%" stop-color="var(--lamp-dark)"/>
            </linearGradient>
            <radialGradient id="bulbGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
              <stop offset="55%" stop-color="var(--lamp-color)" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="var(--lamp-color)" stop-opacity="0"/>
            </radialGradient>
            <filter id="beamBlur" x="-50%" y="-20%" width="200%" height="140%">
              <feGaussianBlur stdDeviation="10"/>
            </filter>
          </defs>
          <!-- 天花板吊线 -->
          <line x1="110" y1="0" x2="110" y2="48" class="lamp__cord-line"/>
          <!-- 灯罩 -->
          <path d="M70 48 L150 48 L185 150 L35 150 Z" fill="url(#shadeGrad)" class="lamp__shade-shape"/>
          <!-- 灯泡光晕 -->
          <ellipse cx="110" cy="140" rx="70" ry="16" fill="url(#bulbGlow)" class="lamp__bulb"/>
          <!-- 光束 -->
          <path d="M110 150 L260 420 L-40 420 Z" fill="rgba(255,255,255,0.10)" filter="url(#beamBlur)" class="lamp__beam-svg"/>
          <!-- 拉绳 -->
          <line x1="150" y1="130" x2="150" y2="260" class="lamp__pull-svgline"/>
          <circle cx="150" cy="270" r="9" class="lamp__pull-svgknob"/>
          <!-- 脸 -->
          <g class="lamp__face">
            <circle cx="92" cy="95" r="7" class="lamp__eye"/>
            <circle cx="128" cy="95" r="7" class="lamp__eye"/>
            <path d="M96 115 Q110 124 124 115" class="lamp__mouth" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </g>
        </svg>
        <button class="lamp__pull" id="lampPull" type="button" aria-label="切换灯光">
          <span class="lamp__pull-text">下拉开灯</span>
        </button>
      </div>

      <div class="auth-card">
        <div class="auth-card__glow" aria-hidden="true"></div>
        <div class="auth-card__inner">
          <h2 class="auth-card__title" id="authTitle">欢迎回来</h2>
          <p class="auth-card__subtitle">Welcome back</p>

          <div class="auth-card__tabs" role="tablist" aria-label="登录方式">
            <button class="auth-card__tab is-active" data-auth-tab="login" type="button" role="tab" aria-selected="true">登录</button>
            <button class="auth-card__tab" data-auth-tab="register" type="button" role="tab" aria-selected="false">注册</button>
          </div>

          <form class="auth-card__form" id="authForm" novalidate>
            <div class="auth-card__field" data-field="identifier">
              <label for="authIdentifier">账号</label>
              <input id="authIdentifier" type="text" name="identifier" autocomplete="username" placeholder="请输入账号" />
            </div>
            <div class="auth-card__field" data-field="username">
              <label for="authUsername">用户名</label>
              <input id="authUsername" type="text" name="username" autocomplete="username" placeholder="3-20 位字母、数字或下划线" />
            </div>
            <div class="auth-card__field" data-field="email">
              <label for="authEmail">邮箱（可选）</label>
              <input id="authEmail" type="email" name="email" autocomplete="email" placeholder="you@example.com" />
            </div>
            <div class="auth-card__field" data-field="phone">
              <label for="authPhone">手机号</label>
              <input id="authPhone" type="tel" name="phone" autocomplete="tel" placeholder="11 位手机号" />
            </div>
            <div class="auth-card__field" data-field="code">
              <label for="authCode">短信验证码</label>
              <div class="auth-card__code-row">
                <input id="authCode" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" />
                <button type="button" class="auth-card__code-btn" data-auth-send>获取验证码</button>
              </div>
            </div>
            <div class="auth-card__field" data-field="password">
              <label for="authPassword">密码</label>
              <input id="authPassword" type="password" name="password" autocomplete="current-password" placeholder="请输入密码" />
            </div>
            <div class="auth-card__error" id="authError" hidden></div>
            <button type="submit" class="auth-card__submit" id="authSubmit">登 录</button>
            <p class="auth-card__hint" id="authHint"></p>
          </form>

          <div class="auth-card__alt">
            <button type="button" class="auth-card__link" data-auth-mode="code">短信验证码登录</button>
            <span class="auth-card__dot" aria-hidden="true"></span>
            <button type="button" class="auth-card__link" data-auth-mode="forgot">忘记密码？</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 进入网站 Onboarding：卡通角色 + 身份卡片 -->
  <div class="onboard-modal" id="onboardModal" aria-hidden="true">
    <div class="onboard-modal__scrim" data-onboard-close></div>
    <div class="onboard-modal__stage" role="dialog" aria-modal="true" aria-labelledby="onboardTitle">
      <div class="onboard-modal__card">
        <button class="onboard-modal__close" type="button" data-onboard-close aria-label="关闭">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>

        <div class="onboard-characters" aria-hidden="true">
          <div class="ob-char ob-char--orange">
          <div class="ob-face">
            <div class="ob-eye ob-eye--left"><div class="ob-pupil"></div></div>
            <div class="ob-eye ob-eye--right"><div class="ob-pupil"></div></div>
            <div class="ob-mouth"></div>
          </div>
        </div>
        <div class="ob-char ob-char--purple">
          <div class="ob-face">
            <div class="ob-eye ob-eye--left"><div class="ob-pupil"></div></div>
            <div class="ob-eye ob-eye--right"><div class="ob-pupil"></div></div>
            <div class="ob-mouth"></div>
          </div>
        </div>
        <div class="ob-char ob-char--black">
          <div class="ob-face">
            <div class="ob-eye ob-eye--left"><div class="ob-pupil"></div></div>
            <div class="ob-eye ob-eye--right"><div class="ob-pupil"></div></div>
            <div class="ob-mouth"></div>
          </div>
        </div>
        <div class="ob-char ob-char--yellow">
          <div class="ob-face ob-face--side">
            <div class="ob-eye ob-eye--single"><div class="ob-pupil"></div></div>
            <div class="ob-mouth"></div>
          </div>
        </div>
      </div>

      <div class="onboard-card">
        <div class="onboard-card__sparkle" aria-hidden="true">✦</div>
        <h2 class="onboard-card__title" id="onboardTitle">欢迎来访！</h2>
        <p class="onboard-card__subtitle">选择您的形象并输入姓名</p>

        <div class="onboard-avatars" id="onboardAvatars" role="radiogroup" aria-label="选择头像">
          <button type="button" class="onboard-avatar is-active" data-avatar="0" aria-label="头像 1" aria-checked="true">
            <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#fde4d0"/><path d="M12 28c0-12 9-20 20-20s20 8 20 20c0 6-2 14-6 18-4 4-10 6-14 6s-10-2-14-6c-4-4-6-12-6-18z" fill="#f5d0a9"/><path d="M12 26c2-8 10-12 20-12s18 4 20 12v6c0 8-6 14-20 14s-20-6-20-14v-6z" fill="#e8b88b"/><circle cx="24" cy="34" r="3" fill="#3d2c24"/><circle cx="40" cy="34" r="3" fill="#3d2c24"/><path d="M28 44q4 4 8 0" fill="none" stroke="#3d2c24" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="onboard-avatar" data-avatar="1" aria-label="头像 2" aria-checked="false">
            <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#fde4d0"/><path d="M10 28c0-10 10-18 22-18s22 8 22 18v8c0 10-10 16-22 16s-22-6-22-16v-8z" fill="#4a3b32"/><circle cx="24" cy="34" r="4" fill="#fff"/><circle cx="40" cy="34" r="4" fill="#fff"/><circle cx="24" cy="34" r="1.5" fill="#3d2c24"/><circle cx="40" cy="34" r="1.5" fill="#3d2c24"/><rect x="20" y="30" width="8" height="8" rx="2" fill="none" stroke="#3d2c24" stroke-width="1.5"/><rect x="36" y="30" width="8" height="8" rx="2" fill="none" stroke="#3d2c24" stroke-width="1.5"/><path d="M27 46q5 4 10 0" fill="none" stroke="#3d2c24" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="onboard-avatar" data-avatar="2" aria-label="头像 3" aria-checked="false">
            <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#fde4d0"/><path d="M18 18c6-6 16-8 24-4 6 3 10 10 10 18v6c0 10-10 16-20 16s-20-6-20-16v-6c0-5 2-10 6-14z" fill="#c68863"/><circle cx="16" cy="28" r="6" fill="#c68863"/><circle cx="48" cy="28" r="6" fill="#c68863"/><circle cx="24" cy="34" r="3" fill="#3d2c24"/><circle cx="40" cy="34" r="3" fill="#3d2c24"/><path d="M28 45q4 4 8 0" fill="none" stroke="#3d2c24" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="onboard-avatar" data-avatar="3" aria-label="头像 4" aria-checked="false">
            <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#fde4d0"/><path d="M12 30c0-10 9-18 20-18s20 8 20 18v8c0 8-9 14-20 14s-20-6-20-14v-8z" fill="#6b4c35"/><circle cx="24" cy="34" r="3" fill="#3d2c24"/><circle cx="40" cy="34" r="3" fill="#3d2c24"/><path d="M28 46q4 4 8 0" fill="none" stroke="#3d2c24" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
          <label class="onboard-avatar onboard-avatar--upload" aria-label="自定义头像">
            <input type="file" id="onboardAvatarUpload" accept="image/*" hidden />
            <span class="onboard-avatar__plus">+</span>
            <img class="onboard-avatar__preview" id="onboardAvatarPreview" alt="" hidden />
          </label>
        </div>

        <form class="onboard-form" id="onboardForm" novalidate>
          <div class="onboard-field">
            <label for="onboardName">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              用户姓名
            </label>
            <input id="onboardName" type="text" name="display_name" autocomplete="nickname" placeholder="在此输入您的昵称..." maxlength="20" />
          </div>
          <div class="onboard-error" id="onboardError" hidden></div>
          <button type="submit" class="onboard-submit" id="onboardSubmit" disabled>
            <span>同步身份并登录</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>

        <p class="onboard-card__footer">专属数字身份</p>
      </div>
    </div>
  </div>
</div>

  <script src="/js/tools.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
